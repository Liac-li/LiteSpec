# Same five target feature layers across all three DFlash controls.
upstream_config: scripts/config/dflash.yaml
algorithm: dflash
target_model: Qwen/Qwen3.5-4B
train_data: /path/to/train.jsonl
output_dir: outputs/dflash_loop_5l1r
device: cuda
target_model_backend: hf_vlm
block_size: 8
batch_size: 1
accumulation_steps: 4
loss_decay_gamma: 4
log_interval: 1
save_interval: 4000
report_to: tensorboard
num_draft_layers: 5
num_loops: 1
target_context_layers: 5
num_epochs: 1
