upstream_config: scripts/config/dlite_sft.yaml
algorithm: dlite
reader_only: true
pretrained_draft: /path/to/Qwen3.5-4B-DLite
target_model: /path/to/Qwen3.5-4B
train_data: /path/to/train.jsonl
output_dir: /path/to/output
device: cuda
model_role: student
target_model_backend: hf_vlm
report_to: tensorboard
log_interval: 1
save_interval: 4000
num_epochs: 3
batch_size: 2
accumulation_steps: 8
block_size: 8
num_anchors: 512
image_max_tokens: 1024
max_length: 4096
gdn_enabled: true
gdn_layer_ids: [14, 30]
gdn_rank: 8
gdn_bottleneck: 128
gdn_chunk_anchors: 16
gdn_feature_mode: full
use_muon: false
learning_rate: 0.0001
weight_decay: 0.0
max_grad_norm: 1.0
final_ce_weight: 1.0
l1_loss_weight: 0.1
base_lm_ce_weight: 0.0
loss_decay_gamma: 4
seed: 42
