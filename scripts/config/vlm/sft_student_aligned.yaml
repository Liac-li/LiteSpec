# Training hyperparameters are inherited from the original direct-SFT recipe.
upstream_config: scripts/config/dlite_sft.yaml
target_model: Qwen/Qwen3.5-4B
train_data: /path/to/train.jsonl
output_dir: outputs/vlm_sft_aligned
device: cuda
model_role: student
final_ce_weight: 1.0
l1_loss_weight: 1.0
learning_rate: 0.001
muon_lr: 0.001
muon_adamw_lr: 0.001
warmup_start_lr: 0.0001
min_learning_rate: 0.0003
warmup_ratio: 0.05
# Synchronized stage diagnostics for the first ten optimizer updates; 0 disables.
timing_steps: 10
# Target-depth stages 0-6 / 7-17 / 18-31. All CHS remain visible to every head.
target_layer_ids: [1, 3, 7, 11, 15, 18, 19, 22, 23, 26, 27, 31]
shared_stage_kv: true
chs_stage_ids: [0, 0, 1, 1, 1, 2, 2, 2, 2, 2, 2, 2]
# HF is required for image tensors and Qwen3.5 hidden-state extraction.
target_model_backend: hf_vlm
# Save at the first complete optimizer window reaching each half epoch.
save_epoch_interval: 0.5
save_interval: 0
log_interval: 1
report_to: swanlab
swanlab_project: qwen35-dlite-vlm
